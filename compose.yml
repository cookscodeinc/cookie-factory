name: cookie-factory

x-image: &image
  image: ${COOKIE_FACTORY_IMAGE:-cookie-factory-toolchain:local}
  init: true

x-toolchain: &toolchain
  <<: *image
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      USER_GID: ${LOCAL_GID:-1000}
      USER_UID: ${LOCAL_UID:-1000}

x-test-service: &test-service
  <<: *image
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  working_dir: /workspace
  command: ["/workspace/tests/container/run.sh"]
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /output:exec,mode=1777
    - /tmp:exec,mode=1777
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ${COOKIECUTTER_ROOT:?Set COOKIECUTTER_ROOT in .env}
      target: /templates
      read_only: true
  environment:
    BUNDLE_GEMFILE: /opt/jekyll/Gemfile
    CI: "1"
    HOME: /tmp/home
    RUFF_CACHE_DIR: /tmp/ruff-cache
    COOKIECUTTER_ROOT: /templates
    XDG_CACHE_HOME: /tmp/cache

services:
  dev:
    <<: *toolchain
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${COOKIECUTTER_ROOT:?Set COOKIECUTTER_ROOT in .env}
        target: /templates
        read_only: true
      - type: volume
        source: dev-home
        target: /home/vscode
    environment:
      COOKIECUTTER_ROOT: /templates

  test:
    <<: *test-service
    network_mode: none

  lint:
    <<: *test-service
    command: ["/workspace/tests/container/lint.sh"]
    network_mode: none

  hooks:
    <<: *image
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    working_dir: /workspace
    command: ["pre-commit", "run", "--all-files", "--show-diff-on-failure"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec,mode=1777
    volumes:
      - type: bind
        source: .
        target: /workspace
    environment:
      HOME: /tmp/home
      PRE_COMMIT_HOME: /tmp/pre-commit
      RUFF_CACHE_DIR: /tmp/ruff-cache

  site-test:
    <<: *test-service
    environment:
      BUILD_SITE: "1"
      BUNDLE_GEMFILE: /opt/jekyll/Gemfile
      CI: "1"
      HOME: /tmp/home
      SKIP_UPSTREAM_TESTS: "1"
      COOKIECUTTER_ROOT: /templates
      XDG_CACHE_HOME: /tmp/cache

volumes:
  dev-home:
