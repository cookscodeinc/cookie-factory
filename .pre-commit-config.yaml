minimum_pre_commit_version: "4.6.2"
default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: Check for added large files
        entry: check-added-large-files
        language: system

      - id: check-ast
        name: Check Python syntax
        entry: check-ast
        language: system
        types:
          - python

      - id: check-case-conflict
        name: Check for case conflicts
        entry: check-case-conflict
        language: system

      - id: check-executables-have-shebangs
        name: Check executable shebangs
        entry: check-executables-have-shebangs
        language: system
        types:
          - text
          - executable

      - id: check-json
        name: Check JSON syntax
        entry: check-json
        language: system
        types:
          - json

      - id: check-merge-conflict
        name: Check for merge conflicts
        entry: check-merge-conflict
        language: system
        types:
          - text

      - id: check-shebang-scripts-are-executable
        name: Check shebang script permissions
        entry: check-shebang-scripts-are-executable
        language: system
        types:
          - text

      - id: check-symlinks
        name: Check for broken symlinks
        entry: check-symlinks
        language: system
        types:
          - symlink

      - id: check-toml
        name: Check TOML syntax
        entry: check-toml
        language: system
        types:
          - toml

      - id: check-yaml
        name: Check YAML syntax
        entry: check-yaml
        language: system
        types:
          - yaml

      - id: debug-statements
        name: Check for Python debug statements
        entry: debug-statement-hook
        language: system
        types:
          - python

      - id: destroyed-symlinks
        name: Check for destroyed symlinks
        entry: destroyed-symlinks
        language: system
        types:
          - file

      - id: detect-private-key
        name: Detect private keys
        entry: detect-private-key
        language: system
        types:
          - text

      - id: fix-byte-order-marker
        name: Remove UTF-8 byte order markers
        entry: fix-byte-order-marker
        language: system
        types:
          - text

      - id: mixed-line-ending
        name: Normalize line endings
        entry: mixed-line-ending
        args:
          - --fix=lf
        language: system
        types:
          - text

      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: trailing-whitespace-fixer
        args:
          - --markdown-linebreak-ext=md
        language: system
        types:
          - text

      - id: end-of-file-fixer
        name: Fix end of files
        entry: end-of-file-fixer
        language: system
        types:
          - text

      - id: requirements-txt-fixer
        name: Sort requirements files
        entry: requirements-txt-fixer
        language: system
        files: (^|/)requirements[^/]*\.txt$

      - id: ruff-check
        name: Ruff lint with safe fixes
        entry: ruff check --fix
        language: system
        require_serial: true
        types_or:
          - python
          - pyi

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        require_serial: true
        types_or:
          - python
          - pyi

      - id: prettier
        name: Prettier format
        entry: prettier --write --ignore-unknown
        language: system
        require_serial: true
        types_or:
          - json
          - markdown
          - yaml

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types:
          - shell

      - id: yamllint
        name: yamllint
        entry: yamllint --config-file .yamllint.yml
        language: system
        types:
          - yaml

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types:
          - yaml

      - id: hadolint
        name: Hadolint
        entry: hadolint --config .hadolint.yml
        language: system
        files: (^|/)Dockerfile$

      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2 --config .markdownlint-cli2.yml
        language: system
        types:
          - markdown

      - id: cspell
        name: CSpell
        entry: cspell --no-progress --show-suggestions
        language: system
        types:
          - text

      - id: validate-pre-commit-config
        name: Validate pre-commit configuration
        entry: pre-commit validate-config
        language: system
        files: ^\.pre-commit-config\.yaml$

      - id: full-repository-lint
        name: Full repository lint suite
        entry: tests/container/lint.sh
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        stages:
          - pre-push
          - manual
