name: Container tests

on:
  pull_request:
  push:
    branches:
      - develop
      - feat-01
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COOKIE_FACTORY_IMAGE: cookie-factory-toolchain:ci
      GITHUB_DOCS_TEMPLATE_DIR: ${{ github.workspace }}/github-doc-cookiecutter
      LOCAL_GID: "1000"
      LOCAL_UID: "1000"

    steps:
      - name: Check out Cookie Factory
        uses: actions/checkout@v5

      - name: Check out GitHub Docs Cookiecutter
        uses: actions/checkout@v5
        with:
          repository: jcook3701/github-doc-cookiecutter
          ref: feat-024
          path: github-doc-cookiecutter

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: cookie-factory-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run offline verification
        run: docker compose run --rm test

      - name: Build generated Jekyll site
        run: docker compose run --rm site-test
