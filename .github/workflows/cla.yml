---
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types:
      - opened
      - closed
      - reopened
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
          (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # Privileged pull_request_target actions must remain pinned to a commit.
        # contributor-license/cla-action v1.0.0
        uses: contributor-license/cla-action@e764f53690399abf600e2932de7ffd607ddb108c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: cla/v1/signatures.json
          path-to-document: >-
            https://github.com/cookscodeinc/cookie-factory/blob/master/.github/CLA.md
          branch: cla-signatures
          allowlist: jcook3701,github-actions[bot],dependabot[bot]
          create-file-commit-message: "chore(CLA): create signature record"
          signed-commit-message: "chore(CLA): $contributorName signed the CLA"
          lock-pullrequest-aftermerge: true
          use-dco-flag: false
