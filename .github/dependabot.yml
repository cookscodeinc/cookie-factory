version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: bundler
    directory: /docker
    target-branch: develop
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
